[package]
name = "trading-bot"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1.0", features = ["full"] }

binance = "0.21"

# HTTP client
reqwest = { version = "0.11", features = ["json"] }

# Data processing (Pandas equivalent)
polars = { version = "0.35", features = ["lazy", "strings", "dtype-struct"] }

# Technical indicators
ta = "0.5"  # Simple TA library

# Telegram bot
teloxide = { version = "0.12", features = ["macros"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Environment variables
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Time
chrono = "0.4"

urlencoding = "2"

hmac = "0.12"
sha2 = "0.10"
hex = "0.4"